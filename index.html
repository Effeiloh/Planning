<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning de Florent</title>
<style id="css">
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#4a4945;--bd:#e3e1da;--ac:#2f6fed;--w:#e3f1e6;--wt:#1d6b35;--o:#ecebe7;--ot:#55544f;--l:#fdf0d5;--lt:#8a5a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--tx:#f0efeb;--mut:#a5a39d;--bd:#34343a;--ac:#6c9bff;--w:#1e3a28;--wt:#8fd6a3;--o:#2d2d32;--ot:#b5b3ad;--l:#40320f;--lt:#f2c46b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--tx:#f0efeb;--mut:#a5a39d;--bd:#34343a;--ac:#6c9bff;--w:#1e3a28;--wt:#8fd6a3;--o:#2d2d32;--ot:#b5b3ad;--l:#40320f;--lt:#f2c46b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:22px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:36px;margin:4px 0 4px}
.sub{color:var(--mut);font-size:20px;margin-bottom:16px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.nav button{font-size:34px;padding:6px 22px;line-height:1.1}
.nav button.lab{flex:1;font-size:24px;font-weight:700;padding:14px 8px;line-height:1.2}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:14px 24px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,.day:focus-visible{outline:4px solid var(--ac);outline-offset:2px}
.pick{background:var(--card);border:3px solid var(--ac);border-radius:16px;padding:16px;margin-bottom:12px;display:grid;gap:12px}
.pick label{font-size:24px;font-weight:700;display:grid;gap:8px}
.pick input{font:inherit;font-size:26px;padding:14px;border-radius:12px;border:2px solid var(--tx);background:var(--bg);color:var(--tx);width:100%}
.pick button,.back{font-size:24px;font-weight:700;padding:16px}
.back{width:100%;margin-bottom:12px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px}
.day.today{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.day.t-work{background:#fff;color:#1d1d1b}
.day.t-work .note{color:#4a4945}
.day.t-off{background:#111;color:#fff}
.day.t-off:not(.today){border-color:#5a5a60}
.day.t-off .note{color:#ddd}
.day.t-off .badge{background:#fff;color:#111}
.day.t-abs{background:#b71c1c;color:#fff;border-color:#7f0000}
.day.t-abs .note{color:#ffe3e3}
.day.t-abs .badge{background:#fff;color:#b71c1c}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dn{font-weight:700;font-size:26px;text-transform:capitalize}
.badge{font-size:20px;font-weight:600;padding:5px 14px;border-radius:99px}
.work{background:var(--w);color:var(--wt)}.off{background:var(--o);color:var(--ot)}.leave{background:var(--l);color:var(--lt)}
.hrs{font-size:48px;font-weight:800;margin-top:8px;line-height:1.1}
.note{color:var(--mut);font-size:22px;margin-top:4px}
.rdvline{margin-top:10px;font-size:22px;font-weight:700}
.drop{margin-top:10px;padding-top:10px;border-top:2px solid currentColor;display:grid;gap:8px;font-size:24px}
.ed{display:grid;gap:10px;margin-top:12px;padding-top:12px;border-top:2px solid currentColor;font-size:20px}
.ed label{font-size:20px;color:inherit;display:grid;gap:4px}
.ed input,.ed select{font:inherit;padding:12px;border-radius:8px;border:2px solid #777;background:#fff;color:#111;width:100%}
.ed .chk{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700}
.ed .chk input{width:32px;height:32px}
.ed .h3{font-size:22px;font-weight:700;margin-top:6px}
.rdv{border:2px solid currentColor;border-radius:12px;padding:12px;display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.msg{color:var(--mut);font-size:20px;text-align:center;min-height:24px;margin:8px 0}
textarea{width:100%;font:14px monospace;padding:10px;border-radius:8px}
</style>
</head>
<body><div id="app"></div><script id="code">
let D={days:{}};
const T={work:'Travail',off:'Repos',leave:'Congé'};
const editing=false;let dirty=false,sel=null,off=0,pick=false,abOpen=false,msg='',showTxt='',abF='',abT='',abN='',open={};
const app=document.getElementById('app');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function wk(o){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const fmt=(d,o)=>d.toLocaleDateString('fr-FR',o);
const day=k=>D.days[k]||(D.days[k]={});
const ch=()=>{dirty=true;msg=''};
const mk=(lab,inp)=>{const l=el('label',0,lab);l.append(inp);return l};
function inp(type,val,ph,fn){const i=el('input');i.type=type;i.value=val||'';if(ph)i.placeholder=ph;i.onchange=()=>fn(i.value);return i}
function eachDay(a,b,fn){const d=new Date(a+'T12:00:00');for(let n=0;n<400&&iso(d)<=b;n++){fn(iso(d));d.setDate(d.getDate()+1)}}
function line(label,val,note){const r=el('div');r.append(el('b',0,label+' : '),document.createTextNode(val+(note?' · '+note:'')));return r}

function render(){
  app.textContent='';
  app.append(el('h1',0,'Planning de Florent'));
  app.append(el('div','sub',editing?'Mode modification — touche un jour pour le changer':'Touche un jour avec 📌 pour voir les rendez-vous'));
  const s=wk(off),e=new Date(s);e.setDate(e.getDate()+6);
  const nav=el('div','nav');
  const pb=el('button',0,'‹');pb.setAttribute('aria-label','Semaine précédente');pb.onclick=()=>{off--;sel=null;pick=false;render()};
  const nb=el('button',0,'›');nb.setAttribute('aria-label','Semaine suivante');nb.onclick=()=>{off++;sel=null;pick=false;render()};
  const lb=el('button','lab',(off===0?'Cette semaine':fmt(s,{day:'numeric',month:'short'})+' – '+fmt(e,{day:'numeric',month:'short'}))+' ▾');
  lb.setAttribute('aria-label','Choisir une date');lb.onclick=()=>{pick=!pick;render()};
  nav.append(pb,lb,nb);app.append(nav);
  if(pick){
    const pk=el('div','pick');
    const lab=el('label',0,'Aller à la date :');
    const i=el('input');i.type='date';i.value=iso(new Date());
    i.onchange=()=>{if(!i.value)return;const d=new Date(i.value+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));off=Math.round((d-wk(0))/604800000);pick=false;sel=null;render()};
    lab.append(i);
    const td=el('button','p','Revenir à aujourd’hui');td.onclick=()=>{off=0;pick=false;sel=null;render()};
    const cl=el('button',0,'Fermer');cl.onclick=()=>{pick=false;render()};
    pk.append(lab,td,cl);app.append(pk);
  }else if(off!==0){
    const bk=el('button','back','Revenir à cette semaine');bk.onclick=()=>{off=0;sel=null;render()};app.append(bk);
  }
  const today=iso(new Date());
  for(let i=0;i<7;i++){
    const d=new Date(s);d.setDate(d.getDate()+i);const k=iso(d);const v=D.days[k]||{};
    const rd=(v.r||[]).slice().sort((x,y)=>(x.h||'').localeCompare(y.h||''));
    const cls=v.a?'abs':v.t;
    const c=el('div','day'+(k===today?' today':'')+(cls?' t-'+cls:''));
    const r=el('div','row');
    r.append(el('span','dn',fmt(d,{weekday:'long',day:'numeric',month:'long'})));
    if(v.a)r.append(el('span','badge','Pas là'));else if(v.t)r.append(el('span','badge '+v.t,T[v.t]));
    c.append(r);
    if(v.a){c.append(el('div','hrs','Pas là'));if(v.an)c.append(el('div','note',v.an))}
    else{
      if(v.t==='work'&&(v.s||v.e))c.append(el('div','hrs',(v.s||'?')+' – '+(v.e||'?')));
      if(v.n)c.append(el('div','note',v.n));
    }
    const isOpen=editing||open[k];
    if(rd.length){
      c.append(el('div','rdvline','📌 '+rd.length+' rendez-vous'+(editing?'':(isOpen?' ▴':' ▾'))));
      if(isOpen){
        const dr=el('div','drop');
        if(!v.a&&v.t==='work'&&(v.s||v.e))dr.append(line('Travail',(v.s||'?')+' – '+(v.e||'?')));
        rd.forEach(x=>dr.append(line('Rendez-vous',(x.h||'?')+(x.f?' – '+x.f:''),x.n)));
        c.append(dr);
      }
    }
    const act=()=>{if(editing){sel=sel===k?null:k}else if(rd.length){open[k]=!open[k]}else return;render()};
    if(editing||rd.length){
      c.style.cursor='pointer';c.tabIndex=0;c.setAttribute('role','button');
      if(!editing)c.setAttribute('aria-expanded',String(!!open[k]));
      c.onclick=ev=>{if(ev.target.closest('.ed'))return;act()};
      c.onkeydown=ev=>{if(ev.target===c&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();act()}};
    }
    app.append(c);
  }
  app.append(el('div','msg',msg));
}

render();
fetch('planning.json?'+Date.now()).then(r=>r.json()).then(j=>{D=j;if(!D.days)D.days={};render()}).catch(()=>{msg='Impossible de charger le planning.';render()});
</script></body></html>
